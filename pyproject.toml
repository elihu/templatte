[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "templatte"
version = "1.0.0"
description = "Automated configuration lifecycle management and secret encryption with a barista touch"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "elihu" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.27.3",
    "rich>=13.7.1",
    "cryptography>=42.0.0",
    "tomlkit>=0.13.2",
    "ruamel.yaml>=0.18.6",
    "pathspec>=0.12.1",
    "pydantic>=2.6.0",
]

[project.scripts]
templatte = "templatte.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["templatte"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
