version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dependabot's `uv` ecosystem keeps uv.lock current (supported per GitHub docs).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
