name: Feature request
description: Suggest an improvement or a new capability.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This issue tracker is public. Do not paste secrets, `templatte.toml`, `.enc` envelopes or `.env` contents. Security-sensitive proposals belong in a private report: see [SECURITY.md](https://github.com/elihu/templatte/blob/develop/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Templatte does not support well?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Include example commands if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
