<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Templatte</title>
  <defs>
    <radialGradient id="coffee" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#6b3d1f"/>
      <stop offset="0.7" stop-color="#502d16"/>
      <stop offset="1" stop-color="#3b200f"/>
    </radialGradient>
    <radialGradient id="crema" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#a0663a" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#a0663a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c48a55"/>
    </radialGradient>
  </defs>

  <!-- saucer -->
  <circle cx="256" cy="256" r="236" fill="#f5f5dc"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#502d16" stroke-width="14"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#e6e2c3" stroke-width="6"/>

  <!-- handle -->
  <rect x="368" y="226" width="104" height="60" rx="30" fill="#502d16"/>
  <rect x="384" y="240" width="72" height="32" rx="16" fill="#f5f5dc"/>

  <!-- cup -->
  <circle cx="256" cy="256" r="160" fill="#502d16"/>
  <circle cx="256" cy="256" r="146" fill="#f5f5dc"/>

  <!-- coffee and crema -->
  <circle cx="256" cy="256" r="124" fill="url(#coffee)"/>
  <circle cx="256" cy="256" r="124" fill="url(#crema)"/>

  <!-- latte art: { · } -->
  <g fill="none" stroke="#f5f5dc" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 196 C192 196 188 206 188 224 L188 240 C188 250 182 256 168 256 C182 256 188 262 188 272 L188 288 C188 306 192 316 214 316"/>
    <path d="M298 196 C320 196 324 206 324 224 L324 240 C324 250 330 256 344 256 C330 256 324 262 324 272 L324 288 C324 306 320 316 298 316"/>
  </g>
  <circle cx="256" cy="256" r="12" fill="#f5f5dc"/>
</svg>
